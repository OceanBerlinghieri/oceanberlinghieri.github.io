name: release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to set (e.g. "v1.2.3")
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          fetch-depth: 0

      - name: Configure git with bot creds
        run: |
          git config user.name "oberlinghieri-release-bot"
          git config user.email "oberlinghieri-release-bot@users.noreply.github.com"

      - name: Fetch develop
        run: git fetch origin develop

      - name: Merge develop into main preserving renames and deletions
        run: |
          git merge origin/develop --no-edit

      - name: Keep blog posts alive while propagating real deletions from develop
        run: |
          deleted_posts=$(git diff --name-status --diff-filter=D -- _posts | awk '{print $2}' || true)
          if [ -n "$deleted_posts" ]; then
            echo "$deleted_posts" | while IFS= read -r path; do
              if [ -n "$path" ]; then
                echo "Restoring post that should remain on main: $path"
                git checkout HEAD -- "$path"
              fi
            done
          fi
          git add -A
          echo "Final staged changes:"
          git diff --cached --name-status

      - name: Commit merge and tag release
        run: |
          if ! git diff --cached --quiet; then
            git commit --allow-empty -m "Bump ${{ github.event.inputs.version }}"
            git tag -a "${{ github.event.inputs.version }}" -m "Release ${{ github.event.inputs.version }}"
          else
            echo "No changes to commit — develop may already be in sync with main"
            exit 1
          fi

      - name: Push main and tags
        run: git push origin main --tags